[main]
term=xterm-256color
font=Comic Code:size=14
pad=14x10
initial-window-mode=windowed
workers=0

[scrollback]
lines=10000
multiplier=7.0

[cursor]
style=block
blink=no

[key-bindings]
clipboard-copy=Control+Insert Control+Shift+c XF86Copy
primary-paste=none
clipboard-paste=Shift+Insert Control+Shift+v XF86Paste

[colors-dark]
foreground=FAFCFB
background=0c0b0c

regular0=000000
regular1=d52b2b
regular2=00c200
regular3=c7c400
regular4=3f61ff
regular5=c930c7
regular6=10999a
regular7=ffffff

bright0=666666
bright1=ff6d67
bright2=5ff967
bright3=fefb67
bright4=6871ff
bright5=ff76ff
bright6=5ffdff
bright7=ffffff

[text-bindings]
# Send Shift+Return as CSI-u so TUIs can distinguish it from Return.
\x1b[13;2u=Shift+Return
# Send Alt+Shift+Return as CSI-u so tmux can match M-S-Enter.
\x1b[13;4u=Mod1+Shift+Return
